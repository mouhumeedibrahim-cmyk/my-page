            text-align: center;
            padding: 0;
            margin: 0;
        }
        .navbar {
            background-color: #1f1f1f;
            padding: 12px 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #e50914;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .navbar a:hover {
            background-color: #e50914;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

            margin: 20px auto;

            background: #1f1f1f;
            border-radius: 8px;
        }
        .quick-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }
        .link-card {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: bold;
        }
        .link-card a {
            background-color: #e50914;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
        }
        .link-card a:hover {
            background-color: #b20710;
        }
    </style>
</head>
