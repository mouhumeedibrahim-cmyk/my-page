<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السينما في بيتك - أحدث الأفلام والمسلسلات</title>
<style>
body {
    font-family: Tahoma, Arial, sans-serif;
    background-color: #121212;
    color: #ffffff;
    text-align: center;
    padding: 0;
    margin: 0;
}
.navbar {
    background-color: #1f1f1f;
    padding: 12px 10px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    border-bottom: 2px solid #e50914;
    position: sticky;
    top: 0;
    z-index: 1000;
}
.navbar a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 4px;
    transition: background 0.3s;
}
.navbar a:hover {
    background-color: #e50914;
}
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}
h1 {
    color: #e50914;
    margin-top: 20px;
}
p {
    color: #b3b3b3;
    font-size: 16px;
}
.ad-box {
    margin: 20px auto;
    padding: 15px;
    background: #1f1f1f;
    border-radius: 8px;
    min-height: 90px;
}
.section-title {
    color: #fff;
    text-align: right;
    margin-top: 30px;
    border-right: 4px solid #e50914;
    padding-right: 10px;
    font-size: 18px;
}
/* تصميم شبكة الأفلام لتظهر جنب بعضها */
.movies-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 15px;
}
.movie-item {
    background: #1f1f1f;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
}
.movie-name {
    font-size: 14px;
    color: #fff;
    font-weight: bold;
}
.movie-item a {
    background-color: #e50914;
    color: white;
    padding: 8px;
    border-radius: 5px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}
.movie-item a:hover {
    background-color: #b20710;
}
</style>
</head>
<body>

<!-- شريط القوائم العلوي -->
<div class="navbar">
    <a href="#arabic">أفلام عربي</a>
    <a href="#foreign">أفلام أجنبي</a>
    <a href="#series">مسلسلات</a>
    <a href="#plays">مسرحيات</a>
</div>

<div class="container">
    <h1>السينما في بيتك</h1>
    <p>استمتع بأحدث الأفلام والمسلسلات بجودة عالية وبدون إعلانات مزعجة لموقعك.</p>

    <!-- مكان إعلان Native Banner -->
    <div class="ad-box">
        <script async="async" data-cfasync="false" src="https://pl30536636.effectivecpmnetwork.com/0d7178a4d0671edd1d94a2119497b065/invoke.js"></script>
        <div id="container-0d7178a4d0671edd1d94a2119497b065"></div>
    </div>

    <!-- قسم الأفلام العربية (الأفلام هتظهر جنم بعض هنا) -->
    <h2 id="arabic" class="section-title">🎬 أفلام عربي</h2>
    <div class="movies-grid">
        <!-- فيلم 1 -->
        <div class="movie-item">
            <span class="movie-name">اسم الفيلم الأول</span>
            <a href="رابط_الفيلم_هنا" target="_blank">مشاهدة الآن</a>
        </div>
        <!-- فيلم 2 -->
        <div class="movie-item">
            <span class="movie-name">اسم الفيلم الثاني</span>
            <a href="رابط_الفيلم_هنا" target="_blank">مشاهدة الآن</a>
        </div>
        <!-- فيلم 3 -->
        <div class="movie-item">
            <span class="movie-name">اسم الفيلم الثالث</span>
            <a href="رابط_الفيلم_هنا" target="_blank">مشاهدة الآن</a>
        </div>
    </div>

    <!-- قسم الأفلام الأجنبية -->
    <h2 id="foreign" class="section-title">🎬 أفلام أجنبي</h2>
    <div class="movies-grid">
        <div class="movie-item">
            <span class="movie-name">اسم الفيلم الأجنبي</span>
            <a href="رابط_الفيلم_هنا" target="_blank">مشاهدة الآن</a>
        </div>
    </div>

</div>

<!-- إعلان Social Bar -->
<script type="text/javascript" src="https://pl30536636.effectivecpmnetwork.com/04/39/2d/04392d1d97986df20738e39faa9c55be.js"></script>

</body>
</html>
