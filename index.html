<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السينما في بيتك - أحدث الأفلام والمسلسلات بجودة عالية</title>
    <meta name="description" content="استمتع بمشاهدة أحدث الأفلام العربية والعالمية، الحصرية والمسلسلات بجودة عالية وبدون إعلانات مزعجة. السينما في بيتك وجهتك الأولى للترفيه.">
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 0;
            margin: 0;
        }
        /* شريط التنقل العلوي الثابت */
        .navbar {
            background-color: #1f1f1f;
            padding: 12px 10px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #e50914;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .navbar a:hover {
            background-color: #e50914;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #e50914;
            margin-top: 20px;
        }
        p {
            color: #b3b3b3;
            font-size: 16px;
        }
        .movie-card {
            background: #1f1f1f;
            margin: 12px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: right;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .movie-title {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
        }
        .watch-btn {
            background-color: #e50914;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .watch-btn:hover {
            background-color: #b20710;
        }
        .ad-box {
            margin: 30px auto;
            padding: 15px;
            background: #1f1f1f;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- شريط القوائم العلوي -->
    <div class="navbar">
        <a href="#arabic-movies">أفلام عربي</a>
        <a href="#foreign-movies">أفلام أجنبي</a>
        <a href="#series">مسلسلات عربية وأجنبية</a>
        <a href="#plays">مسرحيات</a>
    </div>

    <div class="container">
        <h1>السينما في بيتك</h1>
        <p>وجهتك الأولى لمشاهدة أحدث الأفلام والمسلسلات بجودة عالية.</p>

        <!-- مكان إعلان Adsterra -->
        <div class="ad-box">
            <script type="text/javascript">
                // حط هنا كود إعلان Adsterra الخاص بك
            </script>
        </div>

        <!-- قائمة العناصر المباشرة -->
        <div id="arabic-movies" class="movie-card">
            <span class="movie-title">🎬 اسم فيلم عربي هنا</span>
            <a href="رابط_الفيلم" class="watch-btn" target="_blank">مشاهدة الآن</a>
        </div>

        <div id="foreign-movies" class="movie-card">
            <span class="movie-title">🎬 اسم فيلم أجنبي هنا</span>
            <a href="رابط_الفيلم" class="watch-btn" target="_blank">مشاهدة الآن</a>
        </div>

        <div id="series" class="movie-card">
            <span class="movie-title">📺 اسم المسلسل هنا</span>
            <a href="رابط_المسلسل" class="watch-btn" target="_blank">مشاهدة الآن</a>
        </div>

        <div id="plays" class="movie-card">
            <span class="movie-title">🎭 اسم المسرحية هنا</span>
            <a href="رابط_المسرحية" class="watch-btn" target="_blank">مشاهدة الآن</a>
        </div>

    </div>

</body>
</html>
